name: Auto Unzip & Deploy PWA

on:
  push:
    branches: [ main ]
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyni yuklab olish
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ZIP arxivni avtomatik ochish va fayllarni yangilash
        run: |
          set -e
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "Yangi ZIP fayl topilmadi."
            exit 0
          fi

          echo "Ochilmoqda: $ZIP_FILE"
          rm -rf _tmp_extract
          mkdir -p _tmp_extract
          unzip -o "$ZIP_FILE" -d _tmp_extract

          # Agar ZIP ichida bitta umumiy papka bo'lsa, ichidagi fayllarni ko'chiramiz
          TOP_ITEMS=$(ls -A _tmp_extract | wc -l)
          FIRST_ITEM=$(ls -A _tmp_extract | head -n 1)
          if [ "$TOP_ITEMS" -eq 1 ] && [ -d "_tmp_extract/$FIRST_ITEM" ]; then
            cp -rf "_tmp_extract/$FIRST_ITEM/." ./
          else
            cp -rf _tmp_extract/. ./
          fi

          rm -rf _tmp_extract "$ZIP_FILE"

      - name: Yangilangan fayllarni main branchga saqlash
        run: |
          git config [invalid URL] "github-actions[bot]"
          git config [invalid URL] "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "O'zgarish topilmadi."
          else
            git commit -m "chore: auto-unzip PWA update [skip ci]"
            git push origin main
          fi

  deploy-pages:
    needs: unzip-and-commit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ [invalid URL]_url }}
    steps:
      - name: Yangilangan kodni olish
        uses: actions/checkout@v4
        with:
          ref: main

      - name: GitHub Pages ni sozlash
        uses: actions/configure-pages@v5

      - name: Sayt fayllarini tayyorlash
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pages ga nashr qilish
        id: deployment
        uses: actions/deploy-pages@v4
        
