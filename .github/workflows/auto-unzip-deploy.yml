name: Auto Unzip & Deploy PWA

on:
  push:
    branches: [ main ]
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract latest ZIP and update files
        run: |
          set -e
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 0
          fi

          echo "Extracting: $ZIP_FILE"
          rm -rf _tmp_extract
          mkdir -p _tmp_extract
          unzip -o "$ZIP_FILE" -d _tmp_extract

          TOP_ITEMS=$(ls -A _tmp_extract | wc -l)
          FIRST_ITEM=$(ls -A _tmp_extract | head -n 1)
          if [ "$TOP_ITEMS" -eq 1 ] && [ -d "_tmp_extract/$FIRST_ITEM" ]; then
            cp -rf "_tmp_extract/$FIRST_ITEM/." ./
          else
            cp -rf _tmp_extract/. ./
          fi

          rm -rf _tmp_extract "$ZIP_FILE"

      - name: Commit and push updated files
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-unzip PWA update [skip ci]"
            git push origin main
          fi

  deploy-pages:
    needs: unzip-and-commit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout updated main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
