name: Revert Last Commit

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  revert-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert last auto-unzip commit
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          TARGET=$(git log --grep="auto-unzip PWA update" -n 1 --format="%H")
          if [ -z "$TARGET" ]; then
            echo "Auto-unzip commit topilmadi, oxirgi commit bekor qilinmoqda."
            TARGET="HEAD"
          fi
          echo "Reverting commit: $TARGET"
          git revert --no-edit "$TARGET"
          git push origin main

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
